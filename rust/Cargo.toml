[package]
name = "maxion-admin-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/maxion-game-infra/maxgame-admin-guard"
# Consumed as a path dependency by the eight platform services, not from a
# registry — see the repository README for why. `publish = false` keeps an
# accidental `cargo publish` from putting a platform-specific crate on crates.io.
publish = false
description = "Shared admin-auth verifier: offline JWKS/EdDSA verification, live introspection, circuit breaker, and site/feature authorization. Implements the contract in ../contract/README.md."

[dependencies]
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
