[package]
name = "maxgame-readiness"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/maxion-game-infra/maxgame-admin-guard"
# Consumed as a path dependency, like ../rust (see the repository README).
# `publish = false` keeps it off crates.io.
publish = false
description = "Per-hop readiness reporting for /readyz, the /v1/ping identity route and the hop probes. Implements CONTRACT.md in maxion-game-infra/maxgame-readiness-contract."

[features]
# HTTP hop probes (src/http.rs). On by default; build with
# --no-default-features to keep this crate free of an HTTP client.
default = ["http"]
http = ["dep:reqwest", "dep:url"]
# Postgres probe and the dedicated health pool (src/postgres.rs), on sqlx
# 0.8 like the rest of the fleet.
postgres = ["dep:sqlx"]
# Redis PING probe (src/redis_probe.rs), on redis 1.x like auth-server and
# launcher. redis 1.8 needs Rust 1.88.
redis = ["dep:redis"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.8"
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp", "connection-manager"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"
url = { version = "2", optional = true }

[dev-dependencies]
http-body-util = "0.1"
jsonschema = { version = "0.60", default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
