# Canonical deploy-dev workflow for Maxion Rust backend services.
#
# Copy this file into a repo as `.github/workflows/deploy-dev.yml` and fill
# in the two placeholders in the `env:` block below — see README.md in this
# directory for the full copy steps and the per-repo values table. Nothing
# else in this template should need to change per repo; if it does, fix the
# template first and re-copy, don't hand-edit one repo's copy out of sync.
#
# Shape: tag push -> test (gate) -> build & push image (WIF, keyless) ->
# bump the image tag in maxgame-dev-gitopt (ArgoCD then syncs it).
name: deploy-dev

on:
  push:
    tags:
      - 'dev-v*'

# One deploy-dev run at a time, fleet-wide: the test job's Postgres service
# container and the runner's Docker/AR auth are shared per-runner resources,
# and two app repos tagging at once would otherwise race here.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # Per-repo: the repo's full name — identical to REPO_DIR below. Doubles
  # as the Artifact Registry image name AND the `workloads/<app>/`
  # directory in maxgame-dev-gitopt.
  # e.g. "maxgame-admin-auth-server" — see README.md for the full table.
  APP: REPLACE_ME_app_name
  # Per-repo: this repo's own directory name (same value as APP above).
  # Used as the checkout `path:` and as the working directory for
  # `scripts/ci.sh` and the Dockerfile.
  # e.g. "maxgame-admin-auth-server".
  REPO_DIR: REPLACE_ME_repo_dir
  # Pin the guard commit every job in this workflow compiles against.
  # `actions/checkout` with no `ref:` takes the guard's default branch, so an
  # unpinned workflow silently rebuilds against whatever landed on `main`
  # between the run that proved a change and the run that ships it — the
  # `test` job and the `build-push` job can even disagree with each other
  # inside one run. Both checkouts below therefore use this value.
  # **Bump this file and the repo's other deploy workflow together** — dev has
  # to prove the same guard commit prod will ship, or the dev gate proves
  # nothing about prod.
  GUARD_REF: 04f8cd60e93edb14e17d7f28219a32d8c2dcf85c

jobs:
  # Gate: build-push does not run unless this passes.
  test:
    runs-on: [self-hosted, Linux, X64, office]
    container:
      # Prebaked on the runner (template/ci/ci-image.Dockerfile), served
      # from the runner's own localhost:5000 registry — no Docker Hub
      # pull, no pull credentials, no GitHub quota. A fresh runner machine
      # must rebuild it first (instructions in that Dockerfile's header).
      image: localhost:5000/maxgame-ci-rust:1.97
      volumes:
        # Persistent caches on the runner's local disk — deliberately NOT
        # actions/cache: on a self-hosted runner that uploads GBs to
        # GitHub's 10GB/repo cache store over the office WAN on every key
        # change, which is both slower than local disk and the one GitHub
        # quota this pipeline could actually exhaust. The deploy-dev
        # concurrency group serializes all runs, so shared dirs are safe.
        - /home/maxiongame/ci-cache/cargo-registry:/usr/local/cargo/registry
        - /home/maxiongame/ci-cache/target/${{ github.event.repository.name }}:/ci-target
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
    steps:
      - name: Checkout ${{ env.REPO_DIR }}
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      # Sibling layout so the Cargo path-dep `../maxgame-admin-guard/rust`
      # resolves exactly like it does in local dev and in the Dockerfile.
      # `fetch-depth: 0` because `ref:` is a full SHA: a shallow fetch of a
      # SHA that is not the head of any branch (after a force-push, or a
      # commit that was rebased over) can fail. A slightly longer clone is
      # the price of the pin not breaking silently.
      - name: Checkout maxgame-admin-guard
        uses: actions/checkout@v4
        with:
          repository: maxion-game-infra/maxgame-admin-guard
          ref: ${{ env.GUARD_REF }}
          fetch-depth: 0
          path: maxgame-admin-guard

      # TEST_DATABASE_URL is the ONLY db env var this ever sets. Never
      # DATABASE_URL/MIGRATION_DATABASE_URL, never a .env file — ci.sh reads
      # exclusively from TEST_DATABASE_URL and refuses anything but a local
      # host (localhost/127.0.0.1/::1/postgres) precisely so this can't drift
      # onto a pooled or deployed database by accident.
      - name: Run scripts/ci.sh
        working-directory: ${{ env.REPO_DIR }}
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@postgres:5432/postgres
          # Build artifacts land on the mounted per-repo host volume so
          # they survive between runs — without this, every run recompiles
          # the whole dependency tree (~8 of the pilot's 11.5 test-job
          # minutes).
          CARGO_TARGET_DIR: /ci-target
        run: ./scripts/ci.sh

      # This job runs in a container as root, but build-push/deploy-dev run
      # on the host as the runner user (uid 1000) sharing the same _work
      # directory — without this, their checkout cleanup dies with EACCES
      # on root-owned files (proven by pilot run 31888287393).
      - name: Fix workspace ownership for host jobs
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE"

  build-push:
    needs: test
    runs-on: [self-hosted, Linux, X64, office]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout ${{ env.REPO_DIR }}
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO_DIR }}

      # Fresh workspace for this job — repeat the sibling checkout.
      - name: Checkout maxgame-admin-guard
        uses: actions/checkout@v4
        with:
          repository: maxion-game-infra/maxgame-admin-guard
          ref: ${{ env.GUARD_REF }}
          fetch-depth: 0
          path: maxgame-admin-guard

      - name: Authenticate to GCP (Workload Identity Federation, keyless)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/465412464495/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: maxgame-plat-dev-artifact-push@maxion-game-platform.iam.gserviceaccount.com
          token_format: access_token

      # The runner host has no gcloud CLI, and none is needed: auth@v2
      # mints an OAuth access token directly, and docker login accepts it
      # as the password for the special `oauth2accesstoken` user (proven
      # by pilot run 31888986125: "gcloud: command not found").
      - name: Docker login to Artifact Registry
        run: echo "${{ steps.gcp-auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin asia-southeast1-docker.pkg.dev

      # Build context is the workspace parent (this job's root), matching
      # every repo's Dockerfile header — the guard sibling above must be
      # inside it. Each repo's own Dockerfile.dockerignore trims the context
      # back down; this workflow does not need to know its contents.
      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="asia-southeast1-docker.pkg.dev/maxion-game-platform/maxgame-platform-dev/${{ env.APP }}"
          SHA_TAG="dev-$(git -C "${{ env.REPO_DIR }}" rev-parse --short HEAD)"
          docker build \
            -f "${{ env.REPO_DIR }}/Dockerfile" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${SHA_TAG}" \
            .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:${SHA_TAG}"

  deploy-dev:
    needs: build-push
    runs-on: [self-hosted, Linux, X64, office]
    steps:
      # GITOPS_SSH_KEY is an org secret: a write-only deploy key scoped to
      # maxgame-dev-gitopt only, provisioned once outside this workflow.
      - name: Checkout maxgame-dev-gitopt
        uses: actions/checkout@v4
        with:
          repository: maxion-game-infra/maxgame-dev-gitopt
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
          ref: main
          path: maxgame-dev-gitopt

      - name: Bump image tag
        working-directory: maxgame-dev-gitopt
        run: |
          set -euo pipefail
          DEPLOY_FILE="workloads/${{ env.APP }}/deployment.yaml"
          IMAGE="asia-southeast1-docker.pkg.dev/maxion-game-platform/maxgame-platform-dev/${{ env.APP }}"
          sed -i -E "s#(image: ${IMAGE}:).*#\1${GITHUB_REF_NAME}#" "$DEPLOY_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEPLOY_FILE"
          git commit -m "deploy(${{ env.APP }}): ${GITHUB_REF_NAME}"

      # Two repos tagging at once can both land here together; retry the
      # push against a fresh rebase rather than failing the whole run.
      - name: Push to gitops main (retry on race)
        working-directory: maxgame-dev-gitopt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}/3) — pulling and retrying"
            git pull --rebase origin main
          done
          echo "::error::failed to push maxgame-dev-gitopt after 3 attempts"
          exit 1

# ── prod (v*) — not created yet, no prod deploy exists. Stub only. ────────
